plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.shuzhen.puzzle'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'cn.shuzhen.puzzle'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
